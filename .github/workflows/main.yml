name: Movie parley production CI/CD pipeline
on:
  push:
    branches:
      - principal
      - Une-construction-et-mis-en-place-tuyeau-en-github
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

#      - name: Login to DigitalOcean Container Registry
#        uses: docker/login-action@v3
#        with:
#          registry: registry.digitalocean.com/boonstraapplicationdevelopment
#          username: ${{ secrets.DOCR_USERNAME }}
#          password: ${{ secrets.DOCR_PASSWORD }}

      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: registry.digitalocean.com/boonstraapplicationdevelopment/bad-frontend:latest